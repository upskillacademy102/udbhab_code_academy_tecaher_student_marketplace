[flake8]
# black owns formatting and line length; flake8 only checks for real
# problems (undefined names, unused imports, logic errors).
max-line-length = 88
extend-ignore = E203, E501, W503
exclude =
    .git,
    __pycache__,
    .venv,
    */migrations/*,
    staticfiles,
    node_modules
per-file-ignores =
    # Package markers re-export names on purpose.
    __init__.py: F401
    # Django settings modules build on `from .base import *`.
    config/settings/*.py: F403, F405

[isort]
profile = black
skip = .venv, migrations, staticfiles
