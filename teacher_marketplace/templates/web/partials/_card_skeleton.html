{# Card-grid loading skeleton. Requires an Alpine scope with `state`. #}
<div x-show="state === 'loading'" x-cloak class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
  <template x-for="i in 6" :key="i">
    <div class="card card-pad">
      <div class="flex items-center gap-3">
        <div class="skeleton h-11 w-11 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-3.5 w-2/3"></div>
          <div class="skeleton h-3 w-1/3"></div>
        </div>
      </div>
      <div class="mt-4 space-y-2">
        <div class="skeleton h-3 w-full"></div>
        <div class="skeleton h-3 w-5/6"></div>
      </div>
      <div class="mt-4 flex gap-2">
        <div class="skeleton h-6 w-16 rounded-full"></div>
        <div class="skeleton h-6 w-20 rounded-full"></div>
      </div>
    </div>
  </template>
</div>
